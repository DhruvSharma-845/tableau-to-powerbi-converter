name: Convert Tableau to Power BI

on:
  workflow_dispatch:
    inputs:
      tableau_file:
        description: 'Tableau file to convert (e.g., samples/sample_superstore.twbx)'
        required: true
        default: 'samples/sample_superstore.twbx'
      output_format:
        description: 'Output format'
        required: true
        default: 'pbix'
        type: choice
        options:
          - pbix
          - pbip

jobs:
  convert:
    runs-on: windows-latest
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set UTF-8 encoding
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001
        shell: pwsh
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Analyze Tableau workbook
        run: python main.py analyze "${{ github.event.inputs.tableau_file }}"
      
      - name: Convert to PBIX
        if: github.event.inputs.output_format == 'pbix'
        run: |
          # Get base name from input file
          $inputFile = "${{ github.event.inputs.tableau_file }}"
          $baseName = [System.IO.Path]::GetFileNameWithoutExtension($inputFile)
          $pbixPath = "output/$baseName.pbix"
          
          # Create output directory
          New-Item -ItemType Directory -Force -Path output | Out-Null
          
          Write-Host "Converting $inputFile to $pbixPath..."
          python main.py to-pbix "$inputFile" -o "$pbixPath"
          
          if (Test-Path $pbixPath) {
            Write-Host "[SUCCESS] PBIX created: $pbixPath"
            Write-Host "File size: $((Get-Item $pbixPath).Length) bytes"
          } else {
            Write-Host "[ERROR] PBIX file was not created"
            exit 1
          }
        shell: pwsh
      
      - name: Convert to PBIP
        if: github.event.inputs.output_format == 'pbip'
        run: python main.py convert "${{ github.event.inputs.tableau_file }}" -o output/
      
      - name: List all output files
        run: |
          Write-Host "All generated files:"
          Get-ChildItem output/ -Recurse | ForEach-Object { 
            $size = if ($_.PSIsContainer) { "[DIR]" } else { "$($_.Length) bytes" }
            Write-Host "  $($_.FullName) - $size"
          }
        shell: pwsh
      
      - name: Create ZIP packages
        if: github.event.inputs.output_format == 'pbip'
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          
          # Create ZIPs of project folders
          $folders = Get-ChildItem output/ -Directory
          foreach ($folder in $folders) {
            $zipName = "$($folder.Name)-$timestamp.zip"
            Write-Host "Creating $zipName..."
            Compress-Archive -Path $folder.FullName -DestinationPath "output/$zipName" -Force
          }
        shell: pwsh
      
      - name: Upload conversion results
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-conversion-results
          path: |
            output/*.pbix
            output/*.zip
            output/*_validation_report.md
          retention-days: 30
      
      - name: Conversion Summary
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                   CONVERSION COMPLETE"
          Write-Host "============================================================"
          Write-Host ""
          
          # Check for PBIX files
          $pbixFiles = Get-ChildItem output/*.pbix -ErrorAction SilentlyContinue
          if ($pbixFiles) {
            Write-Host "[SUCCESS] PBIX file(s) created!"
            foreach ($pbix in $pbixFiles) {
              Write-Host "  - $($pbix.Name) ($($pbix.Length) bytes)"
            }
          }
          
          # Check for PBIP folders
          $pbipFolders = Get-ChildItem output/*.pbip -Directory -ErrorAction SilentlyContinue
          if ($pbipFolders) {
            Write-Host "[INFO] PBIP folder(s) created:"
            foreach ($pbip in $pbipFolders) {
              Write-Host "  - $($pbip.Name)"
            }
          }
          
          Write-Host ""
          Write-Host "DOWNLOAD INSTRUCTIONS:"
          Write-Host "----------------------"
          Write-Host "1. Scroll down to 'Artifacts' section below"
          Write-Host "2. Click 'powerbi-conversion-results' to download"
          Write-Host "3. Extract the ZIP and open .pbix in Power BI Desktop"
          Write-Host ""
          Write-Host "============================================================"
        shell: pwsh
