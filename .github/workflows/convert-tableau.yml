name: Convert Tableau to Power BI

on:
  workflow_dispatch:
    inputs:
      tableau_file:
        description: 'Tableau file to convert (e.g., samples/sample_superstore.twbx)'
        required: true
        default: 'samples/sample_superstore.twbx'

jobs:
  convert:
    runs-on: windows-latest
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set UTF-8 encoding
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001
        shell: pwsh
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Analyze Tableau workbook
        run: python main.py analyze "${{ github.event.inputs.tableau_file }}"
      
      - name: Convert to Power BI PBIP
        run: python main.py convert "${{ github.event.inputs.tableau_file }}" -o output/
      
      - name: List generated files
        run: |
          Write-Host "Generated files:"
          Get-ChildItem output/ -Recurse | ForEach-Object { Write-Host $_.FullName }
        shell: pwsh
      
      - name: Install Power BI Desktop
        run: |
          Write-Host "Installing Power BI Desktop..."
          # Download Power BI Desktop installer
          $installerUrl = "https://download.microsoft.com/download/8/8/0/880BCA75-79DD-466A-927D-1ABF1F5454B0/PBIDesktopSetup_x64.exe"
          $installerPath = "$env:TEMP\PBIDesktopSetup.exe"
          
          Write-Host "Downloading Power BI Desktop..."
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath -UseBasicParsing
          
          Write-Host "Installing silently (this may take 5-10 minutes)..."
          Start-Process -FilePath $installerPath -ArgumentList "-quiet", "-norestart", "ACCEPT_EULA=1" -Wait -NoNewWindow
          
          Write-Host "Installation complete!"
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
      
      - name: Convert PBIP to PBIX using Power BI Desktop
        run: |
          $pbipFolders = Get-ChildItem output/ -Directory -Filter "*.pbip"
          
          if ($pbipFolders.Count -eq 0) {
            Write-Host "No PBIP folder found, skipping PBIX conversion"
            exit 0
          }
          
          # Find Power BI Desktop
          $pbiPaths = @(
            "C:\Program Files\Microsoft Power BI Desktop\bin\PBIDesktop.exe",
            "${env:ProgramFiles}\Microsoft Power BI Desktop\bin\PBIDesktop.exe",
            "${env:LOCALAPPDATA}\Microsoft\Power BI Desktop\bin\PBIDesktop.exe"
          )
          
          $pbiExe = $null
          foreach ($path in $pbiPaths) {
            if (Test-Path $path) {
              $pbiExe = $path
              break
            }
          }
          
          if ($pbiExe) {
            Write-Host "Found Power BI Desktop at: $pbiExe"
            Write-Host ""
            Write-Host "NOTE: Power BI Desktop cannot be automated for PBIX export in headless mode."
            Write-Host "The PBIP files are ready - open them in Power BI Desktop to save as PBIX."
          } else {
            Write-Host "Power BI Desktop not found in expected locations."
            Write-Host "The PBIP files are ready - download them and open in Power BI Desktop."
          }
        shell: pwsh
        continue-on-error: true
      
      - name: Create downloadable packages
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          
          # Create a ZIP of each PBIP folder
          $pbipFolders = Get-ChildItem output/ -Directory -Filter "*.pbip"
          
          foreach ($pbip in $pbipFolders) {
            $zipName = "$($pbip.BaseName)-pbip-$timestamp.zip"
            Write-Host "Creating $zipName..."
            Compress-Archive -Path $pbip.FullName -DestinationPath "output/$zipName" -Force
          }
          
          # Also create an "all files" zip
          Compress-Archive -Path output/* -DestinationPath "output/all-conversion-results-$timestamp.zip" -Force
          
          Write-Host ""
          Write-Host "Created packages:"
          Get-ChildItem output/*.zip | ForEach-Object { Write-Host "  - $($_.Name)" }
        shell: pwsh
      
      - name: Upload conversion results
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-conversion-results
          path: |
            output/*.zip
            output/*_validation_report.md
          retention-days: 30
      
      - name: Conversion Summary
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                   CONVERSION COMPLETE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Your Power BI files are ready for download!"
          Write-Host ""
          Write-Host "DOWNLOAD INSTRUCTIONS:"
          Write-Host "----------------------"
          Write-Host "1. Scroll down to the 'Artifacts' section below"
          Write-Host "2. Click 'powerbi-conversion-results' to download"
          Write-Host ""
          Write-Host "WHAT'S INCLUDED:"
          Write-Host "----------------"
          Write-Host "  - *-pbip-*.zip     : Power BI Project (unzip and open .pbip file)"
          Write-Host "  - *_validation_report.md : Details on what was converted"
          Write-Host ""
          Write-Host "TO GET A .PBIX FILE:"
          Write-Host "--------------------"
          Write-Host "1. Unzip the -pbip- file"
          Write-Host "2. Open Power BI Desktop on Windows"
          Write-Host "3. File -> Open -> select the .pbip file"
          Write-Host "4. File -> Save As -> choose .pbix format"
          Write-Host ""
          Write-Host "NOTE: If you don't have Windows, share the .pbip ZIP with"
          Write-Host "      a colleague who has Power BI Desktop."
          Write-Host ""
          Write-Host "============================================================"
        shell: pwsh
