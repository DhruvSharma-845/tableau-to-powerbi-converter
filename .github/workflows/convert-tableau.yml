name: Convert Tableau to Power BI

on:
  workflow_dispatch:
    inputs:
      tableau_file:
        description: 'Tableau file to convert (e.g., samples/sample_superstore.twbx)'
        required: true
        default: 'samples/sample_superstore.twbx'
      output_format:
        description: 'Output format (pbitools = compile to PBIX, pbip = Microsoft PBIP format)'
        required: true
        default: 'pbitools'
        type: choice
        options:
          - pbitools
          - pbip

jobs:
  convert:
    runs-on: windows-latest
    
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: 1
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Set UTF-8 encoding
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          chcp 65001
        shell: pwsh
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Analyze Tableau workbook
        run: python main.py analyze "${{ github.event.inputs.tableau_file }}"
      
      - name: Convert to Power BI (pbi-tools format)
        if: github.event.inputs.output_format == 'pbitools'
        run: python main.py convert-pbitools "${{ github.event.inputs.tableau_file }}" -o output/
      
      - name: Convert to Power BI (PBIP format)
        if: github.event.inputs.output_format == 'pbip'
        run: python main.py convert "${{ github.event.inputs.tableau_file }}" -o output/
      
      - name: Setup .NET for pbi-tools
        if: github.event.inputs.output_format == 'pbitools'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Download and install pbi-tools
        if: github.event.inputs.output_format == 'pbitools'
        run: |
          Write-Host "Downloading pbi-tools..."
          
          # Download the latest pbi-tools release
          $releasesUrl = "https://api.github.com/repos/pbi-tools/pbi-tools/releases/latest"
          $release = Invoke-RestMethod -Uri $releasesUrl -Headers @{ 'User-Agent' = 'PowerShell' }
          
          # Find the Core edition ZIP (cross-platform, doesn't need Power BI Desktop)
          $coreAsset = $release.assets | Where-Object { $_.name -like "*Core*.zip" } | Select-Object -First 1
          
          if (-not $coreAsset) {
            # Fallback to regular Windows version
            $coreAsset = $release.assets | Where-Object { $_.name -like "*.zip" -and $_.name -notlike "*Core*" } | Select-Object -First 1
          }
          
          if ($coreAsset) {
            Write-Host "Downloading: $($coreAsset.name)"
            Invoke-WebRequest -Uri $coreAsset.browser_download_url -OutFile "pbi-tools.zip"
            Expand-Archive -Path "pbi-tools.zip" -DestinationPath "pbi-tools" -Force
            Write-Host "pbi-tools installed successfully"
            Get-ChildItem pbi-tools/
          } else {
            Write-Host "Could not find pbi-tools release asset"
            exit 1
          }
        shell: pwsh
      
      - name: Compile to PBIX using pbi-tools
        if: github.event.inputs.output_format == 'pbitools'
        run: |
          $pbixprojFolders = Get-ChildItem output/ -Directory -Filter "*.pbixproj"
          
          if ($pbixprojFolders.Count -eq 0) {
            Write-Host "No .pbixproj folder found in output/"
            Get-ChildItem output/ -Recurse | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          
          foreach ($folder in $pbixprojFolders) {
            $folderPath = $folder.FullName
            $baseName = $folder.BaseName -replace '\.pbixproj$', ''
            $pbixPath = "output/$baseName.pbix"
            
            Write-Host ""
            Write-Host "=========================================="
            Write-Host "Compiling: $folderPath"
            Write-Host "Output: $pbixPath"
            Write-Host "=========================================="
            
            # Find pbi-tools executable
            $pbiToolsExe = Get-ChildItem pbi-tools/ -Recurse -Filter "pbi-tools.exe" | Select-Object -First 1
            
            if (-not $pbiToolsExe) {
              $pbiToolsExe = Get-ChildItem pbi-tools/ -Recurse -Filter "pbi-tools.core.exe" | Select-Object -First 1
            }
            
            if ($pbiToolsExe) {
              Write-Host "Using: $($pbiToolsExe.FullName)"
              
              # Run pbi-tools compile
              & $pbiToolsExe.FullName compile $folderPath -outPath $pbixPath
              
              if (Test-Path $pbixPath) {
                Write-Host "[SUCCESS] Created: $pbixPath"
                Write-Host "File size: $((Get-Item $pbixPath).Length) bytes"
              } else {
                Write-Host "[WARNING] PBIX file was not created"
              }
            } else {
              Write-Host "[ERROR] pbi-tools executable not found"
              Get-ChildItem pbi-tools/ -Recurse
            }
          }
        shell: pwsh
        continue-on-error: true
      
      - name: List all output files
        run: |
          Write-Host "All generated files:"
          Get-ChildItem output/ -Recurse | ForEach-Object { 
            $size = if ($_.PSIsContainer) { "[DIR]" } else { "$($_.Length) bytes" }
            Write-Host "  $($_.FullName) - $size"
          }
        shell: pwsh
      
      - name: Create downloadable packages
        run: |
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          
          # Create ZIPs of project folders
          $folders = Get-ChildItem output/ -Directory
          foreach ($folder in $folders) {
            $zipName = "$($folder.Name)-$timestamp.zip"
            Write-Host "Creating $zipName..."
            Compress-Archive -Path $folder.FullName -DestinationPath "output/$zipName" -Force
          }
          
          # Create an "all files" zip
          Compress-Archive -Path output/* -DestinationPath "output/all-results-$timestamp.zip" -Force
          
          Write-Host ""
          Write-Host "Packages created:"
          Get-ChildItem output/*.zip | ForEach-Object { Write-Host "  - $($_.Name)" }
        shell: pwsh
      
      - name: Upload conversion results
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-conversion-results
          path: |
            output/*.pbix
            output/*.zip
            output/*_validation_report.md
          retention-days: 30
      
      - name: Conversion Summary
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                   CONVERSION COMPLETE"
          Write-Host "============================================================"
          Write-Host ""
          
          # Check if PBIX was created
          $pbixFiles = Get-ChildItem output/*.pbix -ErrorAction SilentlyContinue
          
          if ($pbixFiles) {
            Write-Host "[SUCCESS] PBIX file(s) created!"
            foreach ($pbix in $pbixFiles) {
              Write-Host "  - $($pbix.Name) ($($pbix.Length) bytes)"
            }
          } else {
            Write-Host "[INFO] No PBIX files created."
            Write-Host "       Download the project folder and open in Power BI Desktop."
          }
          
          Write-Host ""
          Write-Host "DOWNLOAD INSTRUCTIONS:"
          Write-Host "----------------------"
          Write-Host "1. Scroll down to the 'Artifacts' section"
          Write-Host "2. Click 'powerbi-conversion-results' to download"
          Write-Host ""
          Write-Host "============================================================"
        shell: pwsh
